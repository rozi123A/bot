# ============================================
# Render.com Deployment Configuration
# ============================================

services:
  - type: web
    name: ads-reward-api
    env: node
    region: oregon
    buildCommand: cd client && npm install && npm run build
    startCommand: cd server && npm install && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: WEBAPP_URL
        value: https://ads-reward-api.onrender.com