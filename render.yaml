# ============================================
# Render.com Deployment Configuration
# ============================================

services:
  - type: web
    name: ads-reward-pro
    env: node
    region: oregon
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000